<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  body { background: #0b1220; color: #e5e7eb; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px; }
  canvas { border: 2px solid #374151; }
  button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 4px; }
  #status { font-size: 18px; min-height: 24px; }
  #scores { display: flex; gap: 24px; font-size: 16px; }
</style>
</head>
<body>
<h1>Snake</h1>
<div id="menu">
  <button id="btn1p">1 Player</button>
  <button id="btn2p">2 Player (network)</button>
</div>
<div id="game" style="display:none; flex-direction: column; align-items: center; gap: 12px;">
  <div id="scores"></div>
  <div id="status"></div>
  <canvas id="canvas" width="480" height="480"></canvas>
  <button id="replay" style="display:none;">Replay</button>
</div>
<script src="game.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const scoresEl = document.getElementById('scores');
const menuEl = document.getElementById('menu');
const gameEl = document.getElementById('game');
const replayEl = document.getElementById('replay');

document.getElementById('btn1p').onclick = () => startOnePlayer();
document.getElementById('btn2p').onclick = () => startTwoPlayer();
replayEl.onclick = () => {
  replayEl.style.display = 'none';
  currentMode === '1p' ? startOnePlayer() : startTwoPlayer();
};
let currentMode = null;

function showGame() { menuEl.style.display = 'none'; gameEl.style.display = 'flex'; }

// ---------- 1 Player (local) ----------
function startOnePlayer() {
  currentMode = '1p';
  showGame();
  const grid = 20;
  let snake = [{ x: 10, y: 10 }];
  let dir = { x: 1, y: 0 };
  let nextDir = dir;
  let food = [];
  let score = 0;
  let alive = true;

  function placeFood() {
    const count = Math.floor(Math.random() * 3) + 1; // 1-3
    food = [];
    for (let i = 0; i < count; i++) {
      let pos;
      do { pos = { x: Math.floor(Math.random() * grid), y: Math.floor(Math.random() * grid) }; }
      while (snake.some(s => s.x === pos.x && s.y === pos.y) || food.some(f => f.x === pos.x && f.y === pos.y));
      food.push(pos);
    }
  }
  placeFood();

  function onKey(e) {
    const d = DIR_KEYS[e.key];
    if (!d) return;
    if (dir.x === -d.x && dir.y === -d.y) return;
    nextDir = d;
  }
  window.addEventListener('keydown', onKey);

  const interval = setInterval(() => {
    if (!alive) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= grid || head.y < 0 || head.y >= grid || snake.some(s => s.x === head.x && s.y === head.y)) {
      alive = false;
      clearInterval(interval);
      window.removeEventListener('keydown', onKey);
      statusEl.textContent = `Game over! Score: ${score}`;
      replayEl.style.display = 'inline-block';
      return;
    }
    snake.unshift(head);
    const foodIdx = food.findIndex(f => f.x === head.x && f.y === head.y);
    if (foodIdx !== -1) {
      score += 1;
      food.splice(foodIdx, 1);
      if (food.length === 0) placeFood();
    } else {
      snake.pop();
    }

    drawBoard(ctx, grid);
    drawFood(ctx, food);
    drawSnake(ctx, { body: snake, alive: true }, 0);
    scoresEl.textContent = '';
    statusEl.textContent = `Score: ${score}`;
  }, 172);
}

// ---------- 2 Player (network) ----------
function startTwoPlayer() {
  currentMode = '2p';
  showGame();
  statusEl.textContent = 'Connecting...';
  const ws = new WebSocket(`ws://${location.host}`);
  let myIndex = null;
  let grid = 20;
  let onKey;

  ws.onopen = () => { statusEl.textContent = 'Waiting for opponent...'; };

  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'joined') { myIndex = msg.playerIndex; grid = msg.grid; }
    else if (msg.type === 'full') { statusEl.textContent = 'Room is full. Try again later.'; ws.close(); }
    else if (msg.type === 'waiting') { statusEl.textContent = `Waiting for opponent... (${msg.connected}/2)`; }
    else if (msg.type === 'start') { statusEl.textContent = `You are Player ${myIndex + 1}`; }
    else if (msg.type === 'state') {
      drawBoard(ctx, msg.grid);
      drawFood(ctx, msg.food);
      msg.snakes.forEach((s, i) => drawSnake(ctx, s, i));
      scoresEl.textContent = msg.snakes.map((s, i) => `Player ${i + 1}: ${s.score}`).join('   ');
    } else if (msg.type === 'gameover') {
      if (msg.winner === null) statusEl.textContent = 'Draw!';
      else statusEl.textContent = msg.winner === myIndex ? 'You win!' : 'You lose!';
      window.removeEventListener('keydown', onKey);
      ws.close();
      replayEl.style.display = 'inline-block';
    }
  };

  onKey = e => {
    const d = DIR_KEYS[e.key];
    if (!d) return;
    ws.send(JSON.stringify({ type: 'direction', dir: d }));
  };
  window.addEventListener('keydown', onKey);
}
</script>
</body>
</html>
